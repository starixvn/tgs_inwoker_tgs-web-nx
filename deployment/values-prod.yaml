# Default values for lobby.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ${image}
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ${tag}

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/configuration-snippet: |
        proxy_set_header Brand-Token $token
  hosts:
    - host: ${domain}
      paths:
      - backend:
          service:
            name: brand-api
            port:
              number: 80
        path: /api/brandcommunication
        pathType: ImplementationSpecific
      - backend:
          service:
            name: brand-api
            port:
              number: 80
        path: /api/brandlivechat
        pathType: ImplementationSpecific
      - backend:
          service:
            name: brand-api
            port:
              number: 80
        path: /api/brand/maintenance
        pathType: Prefix
      - backend:
          service:
            name: lobby-gpi-t1
            port:
              number: 80
        path: /
        pathType: ImplementationSpecific
      - backend:
          service:
            name: operator-api
            port:
              number: 80
        path: /api
        pathType: ImplementationSpecific
  tls: []
  
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector:
  dedicated: frontend

tolerations:
- effect: NoSchedule
  key: dedicated
  operator: Equal
  value: frontend

affinity: {}

resources:
  limits:
    cpu: 100m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi
