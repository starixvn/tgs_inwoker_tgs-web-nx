  - deploy

.docker-build-template: &docker-build-template
  stage: docker-build
  before_script:
    - docker image prune -a -f
    - source get_tgs-env.sh
    - export tgs_env=$(get_environment "$CI_COMMIT_REF_NAME")
    - echo "tgs_env=$tgs_env"
    - echo "app=$app"
    - echo "domain=$domain"
    - echo "brand=$brand"
    - echo "token=$token"
  script:
    - |
      git submodule init
      git submodule sync
      git submodule update --remote
      git status
      yarn add -D @nx/react

      if [[ $app != "" ]]; then 
          yarn docker-build:single $app
      else 
          yarn docker-build:${tgs_env}
      fi
      
      docker image ls
      
      image_count=$(docker image ls | wc  -l)

      if [[ $image_count != "1" ]]; then
          docker image ls | grep pgtgs/tgs-web | awk '{print $1":"$2}' > image.txt
          image_list=$(docker image ls | grep pgtgs/tgs-web | awk '{print $1":"$2}')

          for image in $image_list; do
              echo "image=$image"
              docker push $image
          done
      fi
  artifacts:
    paths:
      - image.txt

.deploy-domain-template: &deploy-domain-template
  stage: deploy-domain
  before_script:
    - source get_tgs-env.sh
    - export tgs_env=$(get_environment "$CI_COMMIT_REF_NAME")
    - echo "tgs_env=$tgs_env"
    - export KUBECONFIG="${config}_${tgs_env}"
    - export KUBECONFIG=${!KUBECONFIG}
    - echo "KUBECONFIG=$KUBECONFIG"
  script:
    - |
      echo "domain=$domain"
      echo "brand=$brand"

      if [[ $domain != "" && $brand != "" ]]; then 
        export image=$(docker image ls | grep pgtgs | awk '{print $1}')
        export tag=$(docker image ls | grep pgtgs | awk '{print $2}')
        echo "image=$image"
        echo "tag=$tag"
        envsubst < ./deployment/values-${tgs_env}.yaml > values.yaml
        helm template $brand deployment -f values.yaml -n ${tgs_env}
        helm template $brand deployment -f values.yaml -n ${tgs_env} | kubectl apply -f -
      else 
        echo "No Deployment Brand and Domain"
      fi
    
.deploy-template: &deploy-template
  stage: deploy
  before_script:
    - source get_tgs-env.sh
    - export tgs_env=$(get_environment "$CI_COMMIT_REF_NAME")
    - echo "tgs_env=$tgs_env"
    - export KUBECONFIG_TEMP="${config}_${tgs_env}"
    - export KUBECONFIG=${!KUBECONFIG_TEMP}
    - echo "KUBECONFIG=$KUBECONFIG"
  script:
    - | 
      if [[ -e image.txt ]]; then 
          cat image.txt
          for image in $(cat image.txt); do
              echo "image=$image"
              ## default
              if [[ "${tgs_env}" != "prod" ]]; then 
                  lobby=$(echo "$image" | sed "s|pgtgs/||" | cut -d':' -f1 | cut -d'-' -f3)
                  lobby="lobby-$lobby"
                  echo "lobby=$lobby"

                  count=$(kubectl get deploy -n $tgs_env | grep $lobby | wc -l)
                  echo "count=$count"
                   
                  if [[ $count -gt 0 ]]; then
                      kubectl set image deployment/$lobby $lobby=${image} --record -n ${tgs_env}
                  fi 
              fi                  
              ## prod
              app=$(echo "$image" | sed "s|pgtgs/||" | cut -d':' -f1)
              lobbies="${tgs_env}_${app//-/_}"
              echo "lobbies=${!lobbies}"    
              IFS=',' read -ra array <<< "${!lobbies}"

              for lb in "${array[@]}"; do
                  kubectl set image deployment/$lb $lb=${image} --record -n ${tgs_env}
              done
          done; 
      fi

docker-build-dev:
  <<: *docker-build-template
  only: 
    - develop

docker-build-staging:
  <<: *docker-build-template
  only: 
    - release/current

docker-build-prod:
  <<: *docker-build-template
  only: 
    - master

deploy-domain-dev:
  <<: *deploy-domain-template
  only: 
    - develop

deploy-domain-staging:
  <<: *deploy-domain-template
  only: 
    - release/current

deploy-domain-prod:
  <<: *deploy-domain-template
  only: 
    - master
    
deploy-dev:
  <<: *deploy-template
  needs:
    - job: docker-build-dev
      artifacts: true
  environment:
    name: dev
  only: 
    - develop

deploy-staging:
  <<: *deploy-template
  needs:
    - job: docker-build-staging
      artifacts: true
  environment:
    name: staging
  only: 
    - release/current

deploy-prod:
  <<: *deploy-template
  needs:
    - job: docker-build-prod
      artifacts: true
  environment:
    name: prod
  only: 
    - master
  #when: manual  