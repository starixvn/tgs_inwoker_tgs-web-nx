variables:
  dev_tgs_web_t29: lobby-t29
  staging_tgs_web_t29: lobby-t29
  prod_tgs_web_t29: lobby-t29
  
stages:
  - docker-build
  - deploy-domain
  - deploy

docker-build-dev:
  stage: docker-build
  before_script:
    - docker image prune -a -f
  script:
    - |
      git submodule init
      git submodule sync
      git submodule update --remote
      git status
      yarn add -D @nx/react
      
      if [[ $app != "" ]]; then 
          yarn docker-build:single $app
      else 
          yarn docker-build:dev  
      fi
     
      image_count=$(docker image ls | wc  -l)
      
      if [[  $image_count != "1" ]]; then
          docker push $(docker image ls | grep pgtgs/tgs-web | awk '{print $1":"$2}')
      fi 
  only: 
    - develop

docker-build-staging:
  stage: docker-build
  before_script:
    - docker image prune -a -f
  script:
    - |
      git submodule init
      git submodule sync
      git submodule update --remote
      git status
      yarn add -D @nx/react
      
      if [[ $app != "" ]]; then 
          yarn docker-build:single $app
      else 
          yarn docker-build:staging  
      fi
     
      image_count=$(docker image ls | wc  -l)
      
      if [[  $image_count != "1" ]]; then
          docker push $(docker image ls | grep pgtgs/tgs-web | awk '{print $1":"$2}')
      fi
  only: 
    - release/current
    
docker-build-prod:
  stage: docker-build
  before_script:
    - docker image prune -a -f
  script:
    - |
      git submodule init
      git submodule sync
      git submodule update --remote
      git status
      yarn add -D @nx/react
      
      if [[ $app != "" ]]; then 
          yarn docker-build:single $app
      else 
          yarn docker-build:prod  
      fi
     
      image_count=$(docker image ls | wc  -l)
      
      if [[  $image_count != "1" ]]; then
          docker push $(docker image ls | grep pgtgs/tgs-web | awk '{print $1":"$2}')
      fi
  only: 
    - master  
    
deploy-domain-dev:
  stage: deploy-domain
  variables:
    tgs_env: dev
  before_script:
    - export KUBECONFIG=$kubeconfig_dev
  needs:
  - job: docker-build
  script:
    - |
      echo "domain=$domain"
      echo "brand=$brand"
      echo "tgs_env=$tgs_env"
      
      if [[ $domain != "" && $brand != "" ]]; then 
        export image=$(docker image ls | grep pgtgs | awk '{print $1}')
        export tag=$(docker image ls | grep pgtgs | awk '{print $2}')
        echo "image=$image"
        echo "tag=$tag"
        envsubst < ./deployment/values-${tgs_env}.yaml > values.yaml
        helm template $brand deployment -f values.yaml -n ${tgs_env}
        helm template $brand deployment -f values.yaml -n ${tgs_env} | kubectl apply -f -
      else 
        echo "No Deployment Brand and Domain"
      fi
  only: 
    - develop
 
