variables:
  app: tgs-web-t23
  dev_tgs_web_t23: lobby-t23
  staging_tgs_web_t23: lobby-t23
  prod_tgs_web_t23: lobby-t23
  
stages:
  - docker-build
  - deploy-domain
  - deploy

docker-build:
  stage: docker-build
  before_script:
    - docker image prune -a -f
  script:
    - git submodule init
    - git submodule sync
    - git submodule update --remote
    - git status
    - yarn add -D @nx/react
    - yarn docker-build:single $app
    - docker image ls
    - docker push $(docker image ls | grep pgtgs/tgs-web | awk '{print $1":"$2}')
  only: 
    - develop
    - release/current
    - master  

deploy-domain-dev:
  stage: deploy-domain
  variables:
    tgs_env: dev
  before_script:
    - export KUBECONFIG=$kubeconfig_dev
  script:
    - |
      echo "domain=$domain"
      echo "brand=$brand"
      echo "tgs_env=$tgs_env"
      
      if [[ $domain != "" && $brand != "" ]]; then 
        export image=$(docker image ls | grep pgtgs | awk '{print $1}')
        export tag=$(docker image ls | grep pgtgs | awk '{print $2}')
        echo "image=$image"
        echo "tag=$tag"
        envsubst < ./deployment/values-${tgs_env}.yaml > values.yaml
        helm template $brand deployment -f values.yaml -n ${tgs_env}
        helm template $brand deployment -f values.yaml -n ${tgs_env} | kubectl apply -f -
      else 
        echo "No Deployment Brand and Domain"
      fi
  only: 
    - develop
 
deploy-domain-staging:
  stage: deploy-domain
  variables:
    tgs_env: staging
  before_script:
    - export KUBECONFIG=$kubeconfig_staging
  script:
    - |
      echo "domain=$domain"
      echo "brand=$brand"
      
      if [[ $domain != "" && $brand != "" ]]; then 
        export image=$(docker image ls | grep pgtgs | awk '{print $1}')
        export tag=$(docker image ls | grep pgtgs | awk '{print $2}')
        echo "image=$image"
        echo "tag=$tag"
        envsubst < ./deployment/values-${tgs_env}.yaml > values.yaml
        helm template $brand deployment -f values.yaml -n ${tgs_env}
        helm template $brand deployment -f values.yaml -n ${tgs_env} | kubectl apply -f -
      else 
        echo "No Deployment Brand and Domain"
      fi
  only: 
    - release/current
    
deploy-domain-prod:
  stage: deploy-domain
  variables:
    tgs_env: prod
  before_script:
    - export KUBECONFIG=$kubeconfig_staging
  script:
    - |
      echo "domain=$domain"
      echo "brand=$brand"
      
      if [[ $domain != "" && $brand != "" ]]; then 
        export image=$(docker image ls | grep pgtgs | awk '{print $1}')
        export tag=$(docker image ls | grep pgtgs | awk '{print $2}')
        echo "image=$image"
        echo "tag=$tag"
        envsubst < ./deployment/values-${tgs_env}.yaml > values.yaml
        helm template $brand deployment -f values.yaml -n ${tgs_env} 
        helm template $brand deployment -f values.yaml -n ${tgs_env} | kubectl apply -f -
      else 
        echo "No Deployment Brand and Domain"
      fi
  only: 
    - master
    
deploy-dev:
  stage: deploy
  needs:
    - job: docker-build
  variables:
    tgs_env: dev
  before_script:
    - export KUBECONFIG=$kubeconfig_dev
  script:
    - | 
      kubectl config get-contexts
      export image=$(docker image ls | grep pgtgs | awk '{print $1}')
      export tag=$(docker image ls | grep pgtgs | awk '{print $2}')
      echo "image=$image"
      echo "tag=$tag"
        
      lobbies="${tgs_env}_${app//-/_}"
      
      echo "lobbies=${!lobbies}"
      
      IFS=', ' read -ra array <<< "${!lobbies}"

      for lobby in "${array[@]}"; do
          echo "$element"
          kubectl set image deployment/$lobby $lobby=${image}:$tag --record -n ${tgs_env}
      done
      echo "Deployment successful"
  environment:
    name: dev
  only: 
    - develop
    
deploy-staging:
  stage: deploy
  needs:
    - job: docker-build
  variables:
    tgs_env: staging
  before_script:
    - export KUBECONFIG=$kubeconfig_staging
  script:
    - | 
      kubectl config get-contexts
      export image=$(docker image ls | grep pgtgs | awk '{print $1}')
      export tag=$(docker image ls | grep pgtgs | awk '{print $2}')
      echo "image=$image"
      echo "tag=$tag"
        
      lobbies="${tgs_env}_${app//-/_}"
      
      IFS=', ' read -ra array <<< "${!lobbies}"

      for lobby in "${array[@]}"; do
          echo "$element"
          kubectl set image deployment/$lobby $lobby=${image}:$tag --record -n ${tgs_env}
      done
      echo "Deployment successful"
  environment:
    name: staging
  only: 
    - release/current
    
deploy-prod:
  stage: deploy
  needs:
    - job: docker-build
  variables:
    tgs_env: prod
  before_script:
    - export KUBECONFIG=$kubeconfig_prod
  script:
    - | 
      kubectl config get-contexts
      export image=$(docker image ls | grep pgtgs | awk '{print $1}')
      export tag=$(docker image ls | grep pgtgs | awk '{print $2}')
      echo "image=$image"
      echo "tag=$tag"
        
      lobbies="${tgs_env}_${app//-/_}"
      
      IFS=', ' read -ra array <<< "${!lobbies}"

      for lobby in "${array[@]}"; do
          echo "$element"
          kubectl set image deployment/$lobby $lobby=${image}:$tag --record -n  ${tgs_env}
      done
      echo "Deployment successful"
  environment:
    name: prod
  only: 
    - master
  when: manual
