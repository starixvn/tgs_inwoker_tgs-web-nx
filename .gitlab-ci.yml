variables:
  app: tgs-web-t23

stages:
  - docker-build
  - deploy-domain
  - deploy

docker-build:
  stage: docker-build
  before_script:
    - docker image prune -a -f
  script:
    - git submodule init
    - git submodule sync
    - git submodule update --remote
    - git status
    - yarn add -D @nx/react
    - yarn docker-build:single $app
    - docker image ls
    - docker push $(docker image ls | grep pgtgs/tgs-web | awk '{print $1":"$2}')
  only: 
    - develop
    - release/current
    - master  

deploy-domain-dev:
  stage: deploy-domain
  script:
    - |
      echo "domain=$domain"
      echo "brand=$brand"
      
      if [[ $domain != "" && $brand != "" ]]; then 
        export image=$(docker image ls | grep pgtgs | awk '{print $1}')
        export tag=$(docker image ls | grep pgtgs | awk '{print $2}')
        echo "image=$image"
        echo "tag=$tag"
        envsubst < ./deployment/values-dev.yaml > values.yaml
        helm template $brand deployment -f values.yaml -n dev
      else 
        echo "No Deployment Brand and Domain"
      fi
  only: 
    - develop
 
deploy-domain-staging:
  stage: deploy-domain
  script:
    - |
      echo "domain=$domain"
      echo "brand=$brand"
      
      if [[ $domain != "" && $brand != "" ]]; then 
        export image=$(docker image ls | grep pgtgs | awk '{print $1}')
        export tag=$(docker image ls | grep pgtgs | awk '{print $2}')
        echo "image=$image"
        echo "tag=$tag"
        envsubst < ./deployment/values-staging.yaml > values.yaml
        helm template $brand deployment -f values.yaml -n staging
      else 
        echo "No Deployment Brand and Domain"
      fi
  only: 
    - relase/current
    
deploy-domain-prod:
  stage: deploy-domain
  script:
    - |
      echo "domain=$domain"
      echo "brand=$brand"
      
      if [[ $domain != "" && $brand != "" ]]; then 
        export image=$(docker image ls | grep pgtgs | awk '{print $1}')
        export tag=$(docker image ls | grep pgtgs | awk '{print $2}')
        echo "image=$image"
        echo "tag=$tag"
        envsubst < ./deployment/values-prod.yaml > values.yaml
        helm template $brand deployment -f values.yaml -n prod
      else 
        echo "No Deployment Brand and Domain"
      fi
  only: 
    - master
    
deploy-dev:
  stage: deploy
  needs:
    - job: docker-build
  before_script:
    - export KUBECONFIG=$kubeconfig_staging
  script:
    - kubectl config get-contexts
    - kubectl set image deployment/$DEPLOY $DEPLOY=${ImageName}:$Tag --record -n dev
    - echo "Deployment successful"
  environment:
    name: dev
  only: 
    - develop
    
deploy-staging:
  stage: deploy
  needs:
    - job: docker-build
  before_script:
    - export KUBECONFIG=$kubeconfig_staging
  script:
    - export Tag=$(cat tag_file)
    - echo "DEPLOY=$DEPLOY"
    - echo "ImageName=$ImageName"
    - echo "Tag=$Tag"
    - kubectl config get-contexts
    - kubectl set image deployment/$DEPLOY $DEPLOY=${ImageName}:$Tag --record -n staging
    - echo "Deployment successful"
  environment:
    name: staging
  only: 
    - release/current
    
deploy-prod:
  stage: deploy
  needs:
    - job: docker-build
  before_script:
    - export KUBECONFIG=$kubeconfig_prod
  script:
    - export Tag=$(cat tag_file)
    - echo "DEPLOY=$DEPLOY"
    - echo "ImageName=$ImageName"
    - echo "Tag=$Tag"
    - kubectl set image deployment/$DEPLOY $DEPLOY=${ImageName}:${Tag} --record -n prod
    - echo "Deployment successful"
  environment:
    name: prod
  only: 
    - master
  when: manual
