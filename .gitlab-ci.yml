.clean_job: &clean_job
  stage: clean
  script:
    - sudo docker system prune -a -f

.docker-build-template: &docker-build-template
  stage: docker-build
  tags:
    - local-build
  before_script:
    - docker image prune -a -f
    - source get_tgs-env.sh
    - export tgs_env=$(get_environment "$CI_COMMIT_REF_NAME")
    - echo "tgs_env=$tgs_env"
    - echo "app=$app"
    - echo "domain=$domain"
    - echo "brand=$brand"
    - echo "token=$token"
  script:
    - |
      curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.1/install.sh | bash

      export NVM_DIR="$([ -z "${XDG_CONFIG_HOME-}" ] && printf %s "${HOME}/.nvm" || printf %s "${XDG_CONFIG_HOME}/nvm")"
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" # This loads nvm

      # nvm install 16.14.0
      nvm use 16.14.0
      node --version
      npm --version
      yarn --version
      # npm add --global nx@latest
      # npx nx init
      nx --version

      yarn add -D @nx/react@17.0.2

      git submodule init
      git submodule sync
      git submodule update --remote
      git status

      if [[ $app != "" ]]; then 
          yarn docker-build:single $app
      else 
          yarn docker-build:${tgs_env}
      fi

      docker image ls  
      image_count=$(docker image ls | wc  -l)

      if [[ $image_count -gt 1 ]]; then
          docker image ls | grep pgtgs/tgs-web | awk '{print $1":"$2}' > image.txt
          image_list=$(docker image ls | grep pgtgs/tgs-web | awk '{print $1":"$2}')

          for image in $image_list; do
              echo "image=$image"
              docker push $image
          done
      fi
  artifacts:
    paths:
      - image.txt

.deploy-domain-template: &deploy-domain-template
  stage: deploy-domain
  image: 
    name: pgtgs/tgs-backend-deploy:latest
  before_script:
    - | 
      #source get_tgs-env.sh
      export tgs_env=$env
      echo "tgs_env=$env"
      if [[ "${tgs_env}" == "dev" ]]; then
        echo "change tgs_env"
        export tgs_env="devops"
      fi
      echo "tgs_env=$tgs_env"
      # export KUBECONFIG="${config}_${tgs_env}"
      # echo "kubeconfig=$KUBECONFIG"
      # export KUBECONFIG=${!KUBECONFIG}
      # echo "KUBECONFIG=$KUBECONFIG"
  script:
    - |
      echo "domain=$domain"
      echo "brand=$brand"
      docker image ls 
      image_count=$(docker image ls | wc  -l)
      echo "image_count=$image_count"

      if [[ $domain != "" && $brand != "" && $image_count -gt 1 ]]; then 
        export image=$(docker image ls | grep pgtgs | awk '{print $1}')
        export tag=$(docker image ls | grep pgtgs | awk '{print $2}')
        echo "image=$image"
        echo "tag=$tag"
        envsubst < ./deployment/values-${tgs_env}.yaml > values.yaml
        helm template $brand deployment -f values.yaml -n ${tgs_env}
        helm template $brand deployment -f values.yaml -n ${tgs_env} | kubectl apply -f -
        
        ## insert variable
        ## https://docs.gitlab.com/ee/api/project_level_variables.html
        echo "project id=$CI_PROJECT_ID"
        app=$(echo "$image" | sed "s|pgtgs/||" | cut -d':' -f1)
        key="${tgs_env}_${app//-/_}"
        echo "key=${key}"
        
        _value=$(curl --header "PRIVATE-TOKEN: $gitlab_token" "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/variables/$key" | jq -r ".value")
        echo "value=$_value"
        
        if [[ "$_value" == "null" ]]; then
            url="https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/variables?key=${key}&value=${brand}&environment_scope=${tgs_env}&protected=true"
            echo "url=$url"
            echo "gitlab_token=$gitlab_token"
            curl --request POST --header "PRIVATE-TOKEN: $gitlab_token" "$url" 
            echo "variable $key created"
        elif [[ ! ${_value} == "$brand" ]]; then 
            new_value="${_value},${brand}"
            url="https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/variables/${key}?value=${new_value}"
            curl --request PUT --header "PRIVATE-TOKEN: $gitlab_token" "$url" 
            echo "variable $key updated"
        fi
        
        ## insert domain    
        if [[ ! "${tgs_env}" == "prod" ]]; then       
            url='https://api.cloudflare.com/client/v4/zones/c6c8be8e9c04948f486101b1b994c09c/dns_records'
            
            responseId=$(curl -X GET "${url}?name=$domain" \
                -H "Authorization: Bearer $cf_token" \
                -H "Content-Type: application/json" | jq -r '.result | .[] | select(.name == "$domain").id ')
             
            if [[ "${responseId}" == "" ]]; then
                result=$(curl -X POST "${url}" \
                   -H "Authorization: Bearer $cf_token" \
                   -H "Content-Type: application/json" \
                 --data '{"type":"CNAME","name":"'$domain'","content":"'${tgs_env}'-entry.rpgp.cc","proxied":true}')
                 
                echo "create result:${result}"
            fi 
        else
            response=$(curl -X GET "https://api.cloudflare.com/client/v4/zones?per_page=1000&name=$domain" \
                -H "Authorization: Bearer $token" \
                -H "Content-Type: application/json")
            zoneid=echo ${response} | jq '.result' | jq  '.[0] | .id'
            echo "zoneid=$zoneid"
            response_create_rule=$(curl -X POST "https://api.cloudflare.com/client/v4/zones/${zoneid}/firewall/rules" \
                -H "Authorization: Bearer $token" \
                -H "Content-Type: application/json" \
                --data '[{"action": "block","paused": false,"description": "Block Taiwan","filter":{"expression": "(ip.geoip.country in {\"TW\"} and not ip.src in {220.133.218.203})","paused": false }}]')
            echo "create result:"
            echo ${response_create_rule} | jq
        fi
      else 
          echo "No Deployment Brand and Domain"
      fi
  after_script:
    - |
      if [[ $domain != "" && $brand != "" ]]; then 
          curl --location --request POST $Telegram_Bot_Url \
            --header 'Content-Type: application/json' \
            --data-binary @- << EOF
          {
            "chat_id": $Telegram_Chat_Id,
            "text": "
          專案: $CI_PROJECT_NAME
          服務: $brand
          分支: $CI_COMMIT_BRANCH
          URL: https://$domain
          Pipeline: $CI_PIPELINE_URL
          Commit: $CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA
          作者: $GITLAB_USER_LOGIN",
            "parse_mode": "HTML"
          }
          EOF
      fi

.deploy-template: &deploy-template
  stage: deploy
  image: 
    name: pgtgs/tgs-backend-deploy:latest
  before_script:
    - |
      export tgs_env=$env
      echo "tgs_env=$tgs_env"
      kube_tgs_env=$tgs_env
      if [[ "${tgs_env}" == "dev" ]]; then
        echo "change tgs_env"
        kube_tgs_env="devops"
      fi
      echo "tgs_env=$tgs_env"
      # export KUBECONFIG_TEMP="${config}_${kube_tgs_env}"
      # export KUBECONFIG=${!KUBECONFIG_TEMP}
      # echo "KUBECONFIG=$KUBECONFIG"
  script:
    - |
      if [[ -e image.txt && $domain == "" && $brand == "" ]]; then 
          cat image.txt
          for image in $(cat image.txt); do
              echo "=================="
              echo "image=$image"
              app=$(echo "$image" | sed "s|pgtgs/||" | cut -d':' -f1)
              lobbies="${env}_${app//-/_}"
              echo "lobbies=${!lobbies}"  
              echo ${!lobbies} > lobby.txt
              IFS=',' read -ra array <<< "${!lobbies}"

              for lb in "${array[@]}"; do
                  kubectl set image deployment/$lb $lb=${image} --record -n ${env}
              done
          done; 
      fi

docker-build-dev:
  <<: *docker-build-template
  only:
    - develop
  except:
    - schedules

docker-build-staging:
  <<: *docker-build-template
  only:
    - release/current
  except:
    - schedules

docker-build-prod:
  <<: *docker-build-template
  only:
    - master
  except:
    - schedules

deploy-domain-dev:
  <<: *deploy-domain-template
  needs:
    - job: docker-build-dev
      artifacts: true
  variables:
    env: dev
  tags:
    - dev
  only:
    - develop
  except:
    - schedules

deploy-domain-staging:
  <<: *deploy-domain-template
  needs:
    - job: docker-build-staging
      artifacts: true
  variables:
    env: staging
  tags:
    - staging
  only:
    - release/current
  except:
    - schedules

deploy-domain-prod:
  <<: *deploy-domain-template
  needs:
    - job: docker-build-prod
      artifacts: true
  variables:
    env: prod
  tags:
    - prod
  only:
    - master
  except:
    - schedules

deploy-dev:
  <<: *deploy-template
  needs:
    - job: docker-build-dev
      artifacts: true
  variables:
    env: dev
  tags:
    - dev
  environment:
    name: dev
  only:
    - develop
  except:
    - schedules

deploy-staging:
  <<: *deploy-template
  needs:
    - job: docker-build-staging
      artifacts: true
  variables:
    env: staging
  environment:
    name: staging
  only:
    - release/current
  except:
    - schedules

deploy-prod:
  <<: *deploy-template
  needs:
    - job: docker-build-prod
      artifacts: true
  variables:
    env: prod
  environment:
    name: prod
  only:
    - master
  except:
    - schedules
  #when: manual

clean_job:
  <<: *clean_job
  only:
    - schedules
